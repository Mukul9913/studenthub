# ==============================================================================
# StudentHub Production Docker Compose Specification
# Microservice: Production API Backend (EC2 / Production Deployment)
# Database: External MongoDB Atlas Cluster (Not containerized)
# ==============================================================================

version: "3.8"

services:
  studenthub-api:
    container_name: studenthub-api-prod
    build:
      context: "../../"
      dockerfile: "apps/api/Dockerfile"
    restart: unless-stopped
    env_file:
      - "../../.env"
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    networks:
      - studenthub-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-5000}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  studenthub-network:
    name: studenthub-network
    driver: bridge
